services:
  - type: web
    name: signalforge-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && pip install ./ai
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DISASTERLENS_STUB
        value: "0"
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_TIMEOUT
        value: "20"
      - key: LLM_MAX_RETRIES
        value: "1"
      - key: LLM_TOTAL_BUDGET
        value: "35"